<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    .panel { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .panel h2 { margin: 0 0 12px; font-size: 18px; }
    .panel form { display: grid; gap: 10px; }
    .panel label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .panel input, .panel textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font: inherit; font-size: 16px; }
    .panel textarea { min-height: 90px; resize: vertical; }
    .panel p { margin: 0 0 12px; }
    button { padding: 10px 18px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #2c405a; color: #ecf4ff; }
    button.danger { background: #d07384; color: #101a28; }
    button:disabled { opacity: .6; cursor: wait; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    li .buttons { margin-top: 12px; }
    li button { padding: 6px 14px; font-size: 14px; }
    .error { margin-top: 10px; color: #ffb3c0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 내 자료만</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 실제 개인정보·비밀번호·연락처를 적지 마세요.</p>
    <div class="notice">로그인한 사람은 자기 메모만 보고 고칠 수 있습니다. 다른 사람의 메모 주소로 요청해도 서버가 주인을 확인해 거부합니다.</div>
    <section class="panel" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <div class="buttons"><button type="submit">로그인</button></div>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <div id="auth-error" class="error" role="alert"></div>
    </section>
    <section class="panel" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">가상 메모 추가</h2>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="200" required></label>
        <label>내용 <textarea id="note-body" maxlength="5000"></textarea></label>
        <div class="buttons">
          <button type="submit" id="note-save">추가</button>
          <button type="button" id="note-cancel" class="secondary" hidden>수정 취소</button>
        </div>
      </form>
      <div id="note-error" class="error" role="alert"></div>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 3단계 제작 1: Supabase Auth 공식 SDK로 이메일·비밀번호 로그인·로그아웃을 붙입니다.
    // Project URL과 publishable key는 공개용 값입니다. 서버 전용 키는 여기에 두지 않습니다.
    // 비밀번호와 세션 토큰은 SDK에만 넘기고 화면·콘솔에 출력하지 않습니다.
    // 3단계 제작 2·3: 메모 API는 세션 토큰을 Authorization 헤더로만 보냅니다.
    // 사용자 ID·역할·owner_id는 보내지 않습니다(서버가 토큰에서 직접 확인).
    const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';
    const SUPABASE_URL = 'https://uibjvuqvkcgumanohtoi.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3hpwOdynmaXDwv_r5tjF3Q_zcE7WQTg';

    const status = document.querySelector('#auth-status');
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#login-email');
    const password = document.querySelector('#login-password');
    const logout = document.querySelector('#logout-button');
    const errorBox = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#editor');
    const editorTitle = document.querySelector('#editor-title');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const noteError = document.querySelector('#note-error');
    let session = null;
    let editingId = null;
    let notesRequest = 0;

    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    async function api(path, { method = 'GET', body } = {}) {
      if (!session?.access_token) throw new Error('로그인이 필요합니다.');
      const headers = { Authorization: `Bearer ${session.access_token}` };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, headers, cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다. 이미 지워졌을 수 있습니다.');
      if (response.status === 400) throw new Error('제목(1~200자)과 내용(5000자 이하)을 확인해 주세요.');
      if (!response.ok) throw new Error('서버에서 요청을 처리하지 못했습니다.');
      return response.status === 204 ? null : response.json();
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      editorTitle.textContent = '가상 메모 추가';
      noteSave.textContent = '추가';
      noteCancel.hidden = true;
      noteError.textContent = '';
    }

    function startEdit(note) {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      editorTitle.textContent = '가상 메모 수정';
      noteSave.textContent = '수정 저장';
      noteCancel.hidden = false;
      noteError.textContent = '';
      noteTitle.focus();
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      title.textContent = note.title;
      content.textContent = note.body;
      const buttons = document.createElement('div');
      buttons.className = 'buttons';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'secondary';
      edit.textContent = '수정';
      edit.addEventListener('click', () => startEdit(note));
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = '삭제';
      remove.addEventListener('click', async () => {
        if (!confirm(`「${note.title}」 메모를 삭제할까요?`)) return;
        noteError.textContent = '';
        remove.disabled = true;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          if (editingId === note.id) resetEditor();
        } catch (error) {
          noteError.textContent = error.message;
        }
        loadNotes();
      });
      buttons.append(edit, remove);
      item.append(title, content, buttons);
      return item;
    }

    async function loadNotes() {
      const request = ++notesRequest;
      if (!session?.access_token) {
        showMessage('로그인하면 가상 메모를 볼 수 있습니다.');
        return;
      }
      try {
        const notes = await api('/api/notes');
        if (request !== notesRequest) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) showMessage('아직 내 가상 메모가 없습니다.');
        else list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (request === notesRequest) showMessage(error.message);
      }
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      noteError.textContent = '';
      noteSave.disabled = true;
      const body = { title: noteTitle.value, body: noteBody.value };
      try {
        if (editingId) await api(`/api/notes/${encodeURIComponent(editingId)}`, { method: 'PUT', body });
        else await api('/api/notes', { method: 'POST', body });
        resetEditor();
        await loadNotes();
      } catch (error) {
        noteError.textContent = error.message;
      } finally {
        noteSave.disabled = false;
      }
    });
    noteCancel.addEventListener('click', resetEditor);

    let supabase;
    try {
      const { createClient } = await import(SDK_URL);
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    } catch {
      status.textContent = '로그인 기능을 불러오지 못했습니다. 새로고침하거나 네트워크를 확인해 주세요.';
      showMessage('로그인 기능을 불러오지 못해 자료를 볼 수 없습니다.');
    }

    function reason(error) {
      if (error?.code === 'invalid_credentials') return '이메일 또는 비밀번호가 맞지 않습니다.';
      if (error?.code === 'email_not_confirmed') return '이메일 인증이 아직 끝나지 않은 계정입니다.';
      if (error?.status === 429 || String(error?.code ?? '').startsWith('over_')) return '요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요.';
      if (error?.status === 0 || error?.name === 'AuthRetryableFetchError') return '로그인 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.';
      return `로그인하지 못했습니다: ${error?.message || '알 수 없는 오류'}`;
    }

    function render() {
      const user = session?.user;
      status.textContent = user
        ? `${user.email} 계정으로 로그인했습니다.`
        : '로그인하지 않았습니다.';
      form.hidden = Boolean(user);
      logout.hidden = !user;
      editor.hidden = !user;
      if (!user) resetEditor();
    }

    if (supabase) {
      form.addEventListener('submit', async event => {
        event.preventDefault();
        errorBox.textContent = '';
        const button = form.querySelector('button');
        button.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: email.value.trim(), password: password.value,
        });
        password.value = '';
        button.disabled = false;
        if (error) errorBox.textContent = reason(error);
      });

      logout.addEventListener('click', async () => {
        errorBox.textContent = '';
        logout.disabled = true;
        const { error } = await supabase.auth.signOut();
        logout.disabled = false;
        if (error) errorBox.textContent = `로그아웃하지 못했습니다: ${error.message}`;
      });

      supabase.auth.onAuthStateChange((_event, nextSession) => {
        session = nextSession;
        render();
        // 콜백 안에서 기다리지 않도록 다음 차례에 메모를 읽습니다.
        setTimeout(loadNotes, 0);
      });
    }
  </script>
</body>
</html>
