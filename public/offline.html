<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 최부장의 비밀창고</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; display: grid; place-items: center; }
    main { max-width: 560px; padding: 32px 22px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>자료실은 연결된 상태에서만 열립니다. 메모와 자료는 이 기기에 저장해 두지 않으므로 오프라인에서는 보여 주지 않습니다.</p>
    <p>연결이 돌아오면 다시 열어 주세요. 앱으로 설치했더라도 서버가 이 기기를 등록 기기로 확인해야 자료실이 열립니다.</p>
  </main>
</body>
</html>
